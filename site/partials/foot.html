<script>
(function () {
  // The Apple menu drops down; every other item is a plain link.
  const apple = document.querySelector('.menubar .item[data-menu]');
  if (apple) {
    const menu = apple.querySelector('.menu');
    const close = () => { apple.setAttribute('aria-expanded', 'false'); menu.classList.remove('open'); };
    const toggle = e => {
      e.preventDefault(); e.stopPropagation();
      const open = apple.getAttribute('aria-expanded') === 'true';
      apple.setAttribute('aria-expanded', String(!open));
      menu.classList.toggle('open', !open);
    };
    apple.addEventListener('click', toggle);
    apple.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') toggle(e); });
    document.addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }
  // Mark the page you are on.
  const here = document.body.dataset.page;
  document.querySelectorAll('.menubar a[data-page]').forEach(a => {
    if (a.dataset.page === here) a.setAttribute('aria-current', 'page');
  });
})();
</script>
