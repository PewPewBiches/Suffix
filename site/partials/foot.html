<script>
// Menu-bar menus, as they behaved: click to open, click away to close.
(function () {
  const items = [...document.querySelectorAll('.menubar .item[data-menu]')];
  const closeAll = () => items.forEach(i => {
    i.setAttribute('aria-expanded', 'false');
    i.querySelector('.menu')?.classList.remove('open');
  });
  items.forEach(item => {
    const open = e => {
      e.preventDefault(); e.stopPropagation();
      const wasOpen = item.getAttribute('aria-expanded') === 'true';
      closeAll();
      if (!wasOpen) {
        item.setAttribute('aria-expanded', 'true');
        item.querySelector('.menu').classList.add('open');
      }
    };
    item.addEventListener('click', open);
    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(e); });
  });
  document.addEventListener('click', closeAll);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
})();
</script>
